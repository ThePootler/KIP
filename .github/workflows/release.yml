name: Release KIP for Windows

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test KIP
        run: dotnet run --project tests/Kip.Checks.csproj -c Release

      - name: Build and check the release ZIP
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $zip = ./release/Build-Release.ps1 -WorkRoot $env:RUNNER_TEMP -Version $version | Select-Object -Last 1
          if ((Split-Path $zip -Leaf) -ne 'KIP-windows-x64.zip') { throw 'Unexpected ZIP filename.' }
          $check = Join-Path $env:RUNNER_TEMP 'extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $check
          $exe = Get-Item -LiteralPath "$check/KIP.exe"
          $manifest = Get-Content -LiteralPath "$check/plugin/.codex-plugin/plugin.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version -or $exe.VersionInfo.FileVersion -ne "$version.0") {
            throw "Expected version $version in the packaged executable and plugin."
          }
          # The plugin installer puts the executable in the package's bin folder.
          $bin = New-Item -ItemType Directory -Path "$check/plugin/bin"
          Copy-Item -LiteralPath $exe.FullName -Destination $bin.FullName
          ./tests/Check-MousePause.ps1 -Package "$check\plugin"
          "KIP_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish the ZIP to the tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $env:KIP_ZIP --verify-tag --generate-notes --title "KIP $tag for Windows"
            exit $LASTEXITCODE
          }
          # A retry can find a draft if the first upload was interrupted.
          $release = $existing | ConvertFrom-Json
          $asset = $release.assets | Where-Object name -eq 'KIP-windows-x64.zip'
          if ($asset.state -ne 'uploaded') {
            gh release upload $tag $env:KIP_ZIP --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($release.isDraft) { gh release edit $tag --draft=false }
